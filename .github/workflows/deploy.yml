on:
  push:
    branches:
      - production
  workflow_dispatch:
name: 🚀 Send Docker image to GitLab registry and deploy to VPS
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitLab
        uses: docker/login-action@v4
        with:
          registry: registry.gitlab.com
          username: ${{ vars.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: registry.gitlab.com/guilheb/boloxe-wallcal:latest

      - name: Update Docker image and restart container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.SSH_HOST }}
          port: ${{ vars.SSH_PORT }}
          username: ${{ vars.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /docker/wallcal.boloxe.com/
            
            echo "Pulling latest image..."
            docker compose pull
            
            echo "Starting new container..."
            docker compose up -d
            
            echo "Pruning unused images..."
            docker image prune -f
            
            echo "🏁 Deployment complete on VPS"